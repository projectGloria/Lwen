name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build the app
        run: npx tauri build --no-bundle --target x86_64-pc-windows-msvc

      - name: Collect runtime files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force app-dist | Out-Null
          Copy-Item src-tauri/target/x86_64-pc-windows-msvc/release/lwen.exe app-dist/

      - name: Download the WebView2 bootstrapper
        shell: pwsh
        run: Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile MicrosoftEdgeWebview2Setup.exe

      - name: Make sure the release exists
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:GITHUB_REF_NAME --generate-notes
            if ($LASTEXITCODE -ne 0) { throw 'could not create the release' }
          }
          $global:LASTEXITCODE = 0

      - uses: projectGloria/GloriaSetup@v0.1.0
        with:
          app-dir: app-dist
          manifest: gloria.toml
          webview2-bootstrapper: MicrosoftEdgeWebview2Setup.exe
          certificate: ${{ secrets.WINDOWS_PFX_BASE64 }}
          certificate-password: ${{ secrets.WINDOWS_PFX_PASSWORD }}
